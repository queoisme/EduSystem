services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: edusystem-db
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 15
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edusystem-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=db;Database=EduSystemDB;User=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sqldata:
